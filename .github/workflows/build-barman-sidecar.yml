name: Build Barman Cloud Sidecar
on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Main image repository (include 'internal' if needed)"
        required: false
        default: "pgedge/plugin-barman-cloud-sidecar-internal"
      ref:
        description: "Git tag or branch from cloudnative-pg/plugin-barman-cloud"
        required: true
        default: "v0.16.0"
      version:
        description: "Plugin version plus build number, without the leading v (e.g., 0.16.0-1); images are tagged v<version>"
        required: true
        default: "0.16.0-1"

# One run at a time per version: every sidecar name pushes the same plugin image, so two
# dispatches must not both pass the tag check below and then overwrite each other's push.
concurrency:
  group: build-barman-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Barman Cloud source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: cloudnative-pg/plugin-barman-cloud
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image variables
        id: vars
        run: |
          IMAGE_NAME="${{ inputs.image_name }}"
          VERSION="${{ inputs.version }}"

          INTERNAL_SUFFIX=""
          if [[ "${IMAGE_NAME}" == *"internal"* ]]; then
            INTERNAL_SUFFIX="-internal"
          fi

          echo "BASE_IMAGE=ghcr.io/pgedge/plugin-barman-cloud-base${INTERNAL_SUFFIX}" >> $GITHUB_ENV
          echo "PLUGIN_IMAGE=ghcr.io/pgedge/plugin-barman-cloud${INTERNAL_SUFFIX}" >> $GITHUB_ENV
          echo "SIDECAR_IMAGE=ghcr.io/${IMAGE_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "INTERNAL_SUFFIX=${INTERNAL_SUFFIX}" >> $GITHUB_ENV

          # v0.12.0+ Dockerfiles parameterize the builder base image as
          # `FROM golang:${GO_VERSION}` and require GO_VERSION to be passed as a
          # build arg (upstream's Taskfile reads it from the go.mod toolchain
          # directive). Derive it the same way; fall back to the `go` directive.
          GO_VERSION="$(sed -n 's/^toolchain go//p' go.mod)"
          if [ -z "${GO_VERSION}" ]; then
            GO_VERSION="$(sed -n 's/^go //p' go.mod)"
          fi
          if [ -z "${GO_VERSION}" ]; then
            echo "::error::Could not determine GO_VERSION from go.mod (no 'toolchain' or 'go' directive); refusing to build with an invalid 'FROM golang:' base image" >&2
            exit 1
          fi
          echo "GO_VERSION=${GO_VERSION}" >> $GITHUB_ENV
          echo "ℹ️ Using GO_VERSION=${GO_VERSION} for builder base image"

      # Images are immutable: every rebuild of a plugin version gets the next build number
      # (v0.16.0-1, v0.16.0-2, ...) and an existing tag is never overwritten.
      - name: Check image tags
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::version must be <plugin version>-<build number>, e.g. 0.16.0-1 (got '$VERSION')"
            exit 1
          fi
          # A release tag must match the version being published (v0.16.0 -> 0.16.0-N).
          tag="${INPUT_REF#refs/tags/}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${VERSION%-*}" != "${tag#v}" ]]; then
            echo "::error::ref $INPUT_REF does not match version $VERSION"
            exit 1
          fi
          images=("$PLUGIN_IMAGE" "$SIDECAR_IMAGE")
          # Builds before v0.11.0 also publish the base image.
          if [ -f containers/Dockerfile.barmanbase ]; then
            images+=("$BASE_IMAGE")
          fi
          for image in "${images[@]}"; do
            ref="${image}:v${VERSION}"
            if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "::error::$ref already exists; use the next build number"
              exit 1
            elif [[ "$(tail -n 1 <<<"$out")" != "ERROR: $ref: not found" ]]; then
              echo "::error::Could not confirm that $ref does not exist: $out"
              exit 1
            fi
          done

      # -------------------------------
      # Check if base image Dockerfile exists (removed in v0.11.0+)
      # -------------------------------
      - name: Check for Dockerfile.barmanbase
        id: check_barmanbase
        run: |
          if [ -f "containers/Dockerfile.barmanbase" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Dockerfile.barmanbase not found - skipping base image build (expected for v0.11.0+)"
          fi

      # -------------------------------
      # Patch Dockerfiles to enforce minimum Go toolchain for CVE fixes
      # -------------------------------
      - name: Patch Go toolchain in Dockerfiles
        run: |
          patched_any=false
          for f in containers/Dockerfile.plugin containers/Dockerfile.sidecar; do
            [ -f "$f" ] || continue
            # Fail closed: the CVE fix depends on this stage existing. If upstream
            # renames/removes the golang builder stage, refuse to build rather than
            # silently shipping binaries built with a vulnerable Go toolchain.
            if ! grep -qE '^FROM.*golang.*AS gobuilder' "$f"; then
              echo "::error::Expected 'FROM ... golang ... AS gobuilder' not found in $f; GOTOOLCHAIN patch cannot be applied. Refusing to build." >&2
              exit 1
            fi
            sed -i '/^FROM.*golang.*AS gobuilder/a ENV GOTOOLCHAIN=go1.26.11+auto' "$f"
            # Verify the patch actually landed before proceeding.
            if ! grep -qF 'ENV GOTOOLCHAIN=go1.26.11+auto' "$f"; then
              echo "::error::Failed to inject 'ENV GOTOOLCHAIN=go1.26.11+auto' into $f." >&2
              exit 1
            fi
            echo "✅ Patched $f"
            patched_any=true
          done
          if [ "$patched_any" != "true" ]; then
            echo "::error::No Dockerfile was patched with GOTOOLCHAIN (expected containers/Dockerfile.plugin and/or containers/Dockerfile.sidecar). Refusing to build." >&2
            exit 1
          fi

      # -------------------------------
      # Build and push Base and Plugin images
      # -------------------------------
      - name: Build and push Base image
        if: steps.check_barmanbase.outputs.exists == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile.barmanbase
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:v${{ env.VERSION }}
            ${{ env.BASE_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push Plugin image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile.plugin
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          tags: |
            ${{ env.PLUGIN_IMAGE }}:v${{ env.VERSION }}
            ${{ env.PLUGIN_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64

      # -------------------------------
      # After Base + Plugin are built, patch Dockerfiles (only for versions that use base image)
      # -------------------------------
      - name: Patch Dockerfiles to use freshly built images
        if: steps.check_barmanbase.outputs.exists == 'true'
        run: |
          echo "🩹 Updating Dockerfiles to use freshly built pgEdge images..."

          # Patch Plugin reference in Sidecar Dockerfile
          sed -i "s|ghcr.io/cloudnative-pg/plugin-barman-cloud-plugin:[^ ]*|${PLUGIN_IMAGE}:v${VERSION}|g" containers/Dockerfile.sidecar || true
          # Patch Base reference in Plugin and Sidecar Dockerfiles
          sed -i "s|ghcr.io/cloudnative-pg/plugin-barman-cloud-base:[^ ]*|${BASE_IMAGE}:v${VERSION}|g" containers/Dockerfile.plugin containers/Dockerfile.sidecar || true

          echo "✅ Dockerfiles patched successfully"
          echo "--- Updated sidecar Dockerfile ---"
          grep -E "FROM|BASE_IMAGE|PLUGIN_IMAGE" containers/Dockerfile.sidecar || true

      # -------------------------------
      # Build and push Sidecar image
      # -------------------------------
      - name: Build and push Sidecar image (with base image)
        if: steps.check_barmanbase.outputs.exists == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile.sidecar
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}:v${{ env.VERSION }}
            PLUGIN_IMAGE=${{ env.PLUGIN_IMAGE }}:v${{ env.VERSION }}
          tags: |
            ${{ env.SIDECAR_IMAGE }}:v${{ env.VERSION }}
            ${{ env.SIDECAR_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push Sidecar image (standalone, v0.11.0+)
        if: steps.check_barmanbase.outputs.exists == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/Dockerfile.sidecar
          push: true
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          tags: |
            ${{ env.SIDECAR_IMAGE }}:v${{ env.VERSION }}
            ${{ env.SIDECAR_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64

      - name: Verify pushed manifest
        run: |
          echo "🔍 Verifying sidecar manifest:"
          docker buildx imagetools inspect ${{ env.SIDECAR_IMAGE }}:v${{ env.VERSION }}

