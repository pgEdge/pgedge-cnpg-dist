name: Build and Push Multi-Arch CNPG Operator

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image repository to push to"
        required: false
        default: "pgedge/cloudnative-pg-internal"
      ref:
        description: "CNPG Git tag or branch (e.g. v1.30.2 or main)"
        required: true
        default: "v1.30.2"
      version:
        description: "Image tag to publish: operator version plus build number (e.g. 1.30.2-1)"
        required: true
        default: "1.30.2-1"

# One run at a time per destination image and tag, so two dispatches cannot both pass the
# tag check below and then overwrite each other's push.
concurrency:
  group: build-cnpg-${{ github.event.inputs.image_name }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  build-cnpg-operator:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout CNPG source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: cloudnative-pg/cloudnative-pg
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Enforce minimum Go toolchain for CVE fixes
        run: echo "GOTOOLCHAIN=go1.26.11+auto" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are immutable: every rebuild of an operator version gets the next build
      # number (1.30.2-1, 1.30.2-2, ...) and an existing tag is never overwritten.
      - name: Check image tag
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_IMAGE_NAME: ${{ github.event.inputs.image_name }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::version must be <operator version>-<build number>, e.g. 1.30.2-1 (got '$INPUT_VERSION')"
            exit 1
          fi
          # A release tag must match the version being published (v1.30.2 -> 1.30.2-N).
          if [[ "$INPUT_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ "${INPUT_VERSION%-*}" != "${INPUT_REF#v}" ]]; then
            echo "::error::ref $INPUT_REF does not match version $INPUT_VERSION"
            exit 1
          fi
          ref="ghcr.io/${INPUT_IMAGE_NAME}:${INPUT_VERSION}"
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::error::$ref already exists; use the next build number"
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
            echo "::error::Could not confirm that $ref does not exist: $out"
            exit 1
          fi

      - name: Build manager binaries for amd64 and arm64
        run: |
          mkdir -p dist/manager
          VERSION=$(grep -E 'Version[[:space:]]*=' pkg/versions/versions.go | head -1 | cut -d'"' -f2)
          COMMIT=$(git rev-parse --short=9 HEAD)
          DATE=$(date -u +'%Y-%m-%d')

          echo "🔧 Building amd64 binary..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildVersion=${VERSION} \
                      -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildCommit=${COMMIT} \
                      -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildDate=${DATE}" \
            -o dist/manager/manager_amd64 ./cmd/manager

          echo "🔧 Building arm64 binary..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildVersion=${VERSION} \
                      -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildCommit=${COMMIT} \
                      -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildDate=${DATE}" \
            -o dist/manager/manager_arm64 ./cmd/manager

          ls -lh dist/manager

      - name: Build and push multi-arch image
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_IMAGE_NAME: ${{ github.event.inputs.image_name }}
        run: |
          REF="$INPUT_REF"
          VERSION="$INPUT_VERSION"
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IMAGE="ghcr.io/${INPUT_IMAGE_NAME}"

          echo "Building CNPG image for ref: $REF"
          echo "Tag: $VERSION"
          echo "Commit: $COMMIT"
          echo "Date: $DATE"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=$REF \
            --build-arg COMMIT=$COMMIT \
            --build-arg DATE=$DATE \
            -t ${IMAGE}:${VERSION} \
            -t ${IMAGE}:latest \
            --push .

      - name: Verify pushed manifest
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_IMAGE_NAME: ${{ github.event.inputs.image_name }}
        run: |
          IMAGE="ghcr.io/${INPUT_IMAGE_NAME}:${INPUT_VERSION}"
          echo "🔍 Checking multi-arch manifest:"
          docker buildx imagetools inspect $IMAGE

