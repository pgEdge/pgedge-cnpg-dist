# Trivy ignore file for ghcr.io/pgedge/cloudnative-pg
# Policy: OS packages are not updated beyond what the base image provides at build time.
#         Go dependencies are not updated until upstream cloudnative-pg/cloudnative-pg
#         releases a new tagged version with fixes. Fixes requiring go.mod source changes
#         cannot be applied by a rebuild alone.
# Note: Go stdlib CVEs are fixed by setting GOTOOLCHAIN=go1.26.5+auto in the build workflow
#       (.github/workflows/build-cnpg-operator.yml), so they are NOT suppressed here.

vulnerabilities:

  # ── Go binary: google.golang.org/grpc ────────────────────────────────────────
  # Pinned at v1.81.1 in upstream cloudnative-pg go.mod.
  # Fix requires a go.mod source change — cannot be applied by a rebuild alone.
  # Suppressed pending upstream cloudnative-pg/cloudnative-pg releasing a new tag.

  - id: GHSA-hrxh-6v49-42gf
    statement: "google.golang.org/grpc v1.81.1 pinned in upstream cloudnative-pg go.mod; fix requires v1.82.1. Requires go.mod source change — cannot be fixed by a rebuild alone. Suppressed pending upstream release."
