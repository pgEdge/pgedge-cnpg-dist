# Trivy ignore file for ghcr.io/pgedge/plugin-barman-cloud-sidecar
# Policy: OS packages (Debian base) are not updated beyond what the base image provides
#         at build time; CVEs with no fix are suppressed pending Debian packaging.
#         Go and Python dependencies are pinned by upstream cloudnative-pg/plugin-barman-cloud
#         and are not updated until upstream releases a new tagged version. Fixes requiring
#         go.mod / dependency-lock source changes cannot be applied by a rebuild alone.
# Note: Go stdlib CVEs are fixed by setting GOTOOLCHAIN=go1.26.5+auto in the build workflow
#       (.github/workflows/build-barman-sidecar.yml), so they are NOT suppressed here.

vulnerabilities:

  # ── Go binary dependencies (pinned in upstream plugin-barman-cloud go.mod) ────
