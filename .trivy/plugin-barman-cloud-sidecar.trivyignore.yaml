    expired_at: 2027-02-18
  - id: CVE-2026-7210
    statement: "Risk accepted: hash-flooding DoS in xml.parsers.expat / ElementTree. botocore and azure-storage-blob parse XML responses, so it is reachable only through responses from the object-store endpoint configured in the ObjectStore resource (operator-controlled, normally TLS). Impact is CPU exhaustion of the backup sidecar, not code execution. No fix in Debian 13 yet; revisit when Debian ships one."
    purls:
      - "pkg:deb/debian/libpython3.13-minimal"
      - "pkg:deb/debian/libpython3.13-stdlib"
      - "pkg:deb/debian/python3.13-minimal"
      - "pkg:deb/debian/python3.13-venv"
    expired_at: 2027-02-18
