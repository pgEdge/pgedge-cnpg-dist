# Trivy ignore file for ghcr.io/pgedge/plugin-barman-cloud
# Policy: OS packages are provided by the registry.access.redhat.com/ubi9/ubi-micro base
#         image (floating tag) and are refreshed by rebuilding; only OS CVEs with no fix
#         available in RHEL 9 are suppressed here.
#         Go dependencies are not updated until upstream cloudnative-pg/plugin-barman-cloud
#         releases a new tagged version with fixes. Fixes requiring go.mod source changes
#         cannot be applied by a rebuild alone.
# Note: Go stdlib CVEs are fixed by setting GOTOOLCHAIN=go1.26.5+auto in the build workflow
#       (.github/workflows/build-barman-sidecar.yml), so they are NOT suppressed here.

